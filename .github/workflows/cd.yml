name: Platform K8s CD

on:
  workflow_run:
    workflows:
      - Platform K8s CI
    types:
      - completed

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'homologation'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: homologation
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require deployment configuration
        run: test -n "${KUBECONFIG_B64}" || { echo "KUBECONFIG_B64 is required."; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Validate platform configuration
        run: npm run validate

      - name: Configure kubeconfig
        run: |
          mkdir -p "${HOME}/.kube"
          printf '%s' "${KUBECONFIG_B64}" | base64 --decode > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Apply platform manifests
        run: kubectl apply -k k8s

      - name: Wait for platform rollouts
        run: |
          kubectl rollout status deployment/kong-gateway -n tech-challenge-gateway --timeout=5m
          kubectl rollout status deployment/rabbitmq -n tech-challenge-messaging --timeout=5m
          kubectl rollout status deployment/prometheus -n tech-challenge-observability --timeout=5m
          kubectl rollout status deployment/grafana -n tech-challenge-observability --timeout=5m
          kubectl rollout status deployment/otel-collector -n tech-challenge-observability --timeout=5m

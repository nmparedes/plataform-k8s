apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
  namespace: tech-challenge-gateway
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/part-of: tech-challenge-phase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
        app.kubernetes.io/part-of: tech-challenge-phase4
    spec:
      containers:
        - name: kong
          image: kong:3.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yml
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
          readinessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: kong-declarative-config
              mountPath: /kong/declarative
              readOnly: true
      volumes:
        - name: kong-declarative-config
          configMap:
            name: kong-declarative-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: tech-challenge-gateway
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/part-of: tech-challenge-phase4
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: kong
  ports:
    - name: proxy
      port: 80
      targetPort: proxy
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: tech-challenge-gateway
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/part-of: tech-challenge-phase4
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kong
  ports:
    - name: admin
      port: 8001
      targetPort: admin

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tech-challenge-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: tech-challenge-phase4
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
      - job_name: kubernetes-services
        kubernetes_sd_configs:
          - role: service
      - job_name: kubernetes-nodes-cadvisor
        scheme: https
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - job_name: platform-component-health
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: tech-challenge-.+
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
  alerts.yml: |
    groups:
      - name: platform-uptime
        rules:
          - alert: ServiceUnavailable
            expr: up{namespace=~"tech-challenge-.+"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Platform or service target is unavailable
          - alert: HighApiLatency
            expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: API p95 latency is above two seconds
      - name: service-order-processing
        rules:
          - alert: OrderProcessingFailures
            expr: increase(order_processing_failures_total[5m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Order processing failures detected
          - alert: IntegrationFailures
            expr: increase(integration_failures_total[5m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Service integration failures detected
      - name: kubernetes-resources
        rules:
          - alert: HighContainerCpuUsage
            expr: sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~"tech-challenge-.+", container!=""}[5m])) > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Container CPU usage is high
          - alert: HighContainerMemoryUsage
            expr: sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~"tech-challenge-.+", container!=""}) > 536870912
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Container memory usage is high
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: tech-challenge-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: tech-challenge-phase4
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tech-challenge-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: tech-challenge-phase4
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tech-challenge-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: tech-challenge-phase4
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tech-challenge-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: tech-challenge-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: tech-challenge-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: tech-challenge-phase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: tech-challenge-phase4
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: prometheus-config
              mountPath: /etc/prometheus/rules/alerts.yml
              subPath: alerts.yml
              readOnly: true
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: tech-challenge-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: tech-challenge-phase4
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http

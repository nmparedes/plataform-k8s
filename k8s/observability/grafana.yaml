apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: tech-challenge-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: tech-challenge-phase4
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.tech-challenge-observability.svc.cluster.local:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: tech-challenge
        orgId: 1
        folder: Tech Challenge
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  order-flow-dashboard.json: |
    {
      "title": "Tech Challenge Order Flow",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "API p95 latency",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service))"
            }
          ]
        },
        {
          "id": 2,
          "title": "Kubernetes CPU usage",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~\"tech-challenge-.+\", container!=\"\"}[5m]))"
            }
          ]
        },
        {
          "id": 3,
          "title": "Kubernetes memory usage",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"tech-challenge-.+\", container!=\"\"})"
            }
          ]
        },
        {
          "id": 4,
          "title": "Healthcheck uptime",
          "type": "stat",
          "targets": [
            {
              "expr": "avg_over_time(up{namespace=~\"tech-challenge-.+\"}[5m])"
            }
          ]
        },
        {
          "id": 5,
          "title": "Daily service-order volume",
          "type": "timeseries",
          "targets": [{ "expr": "sum(increase(order_created_total[1d]))" }]
        },
        {
          "id": 6,
          "title": "Average execution time by status",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (status) (rate(order_execution_duration_seconds_sum[5m])) / sum by (status) (rate(order_execution_duration_seconds_count[5m]))"
            }
          ]
        },
        {
          "id": 7,
          "title": "Integration failures",
          "type": "timeseries",
          "targets": [{ "expr": "sum(increase(integration_failures_total[5m]))" }]
        },
        {
          "id": 8,
          "title": "Order processing failures",
          "type": "timeseries",
          "targets": [{ "expr": "sum(increase(order_processing_failures_total[5m]))" }]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tech-challenge-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: tech-challenge-phase4
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: tech-challenge-phase4
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.3
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: username
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
              readOnly: true
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: grafana-provisioning
              mountPath: /var/lib/grafana/dashboards/order-flow-dashboard.json
              subPath: order-flow-dashboard.json
              readOnly: true
      volumes:
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: tech-challenge-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: tech-challenge-phase4
type: Opaque
stringData:
  username: admin
  password: replace-with-grafana-admin-password
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: tech-challenge-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: tech-challenge-phase4
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http

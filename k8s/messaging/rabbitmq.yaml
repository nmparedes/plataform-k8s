apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-default-user
  namespace: tech-challenge-messaging
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: tech-challenge-phase4
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-definitions
  namespace: tech-challenge-messaging
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: tech-challenge-phase4
data:
  definitions.json: |
    {
      "exchanges": [
        { "name": "orders.topic", "vhost": "/", "type": "topic", "durable": true, "auto_delete": false },
        { "name": "billing.topic", "vhost": "/", "type": "topic", "durable": true, "auto_delete": false },
        { "name": "workshop.topic", "vhost": "/", "type": "topic", "durable": true, "auto_delete": false },
        { "name": "orders.topic.retry", "vhost": "/", "type": "topic", "durable": true, "auto_delete": false },
        { "name": "billing.topic.retry", "vhost": "/", "type": "topic", "durable": true, "auto_delete": false },
        { "name": "workshop.topic.retry", "vhost": "/", "type": "topic", "durable": true, "auto_delete": false },
        { "name": "dead-letter.topic", "vhost": "/", "type": "topic", "durable": true, "auto_delete": false }
      ],
      "queues": [
        { "name": "billing.budget.requests", "vhost": "/", "durable": true, "auto_delete": false },
        { "name": "billing.payment.compensation.requests", "vhost": "/", "durable": true, "auto_delete": false },
        { "name": "os.billing.events", "vhost": "/", "durable": true, "auto_delete": false },
        { "name": "workshop.stock.requests", "vhost": "/", "durable": true, "auto_delete": false },
        { "name": "workshop.execution.requests", "vhost": "/", "durable": true, "auto_delete": false },
        { "name": "os.workshop.events", "vhost": "/", "durable": true, "auto_delete": false },
        { "name": "orders.retry", "vhost": "/", "durable": true, "auto_delete": false, "arguments": { "x-message-ttl": 5000, "x-dead-letter-exchange": "orders.topic" } },
        { "name": "billing.retry", "vhost": "/", "durable": true, "auto_delete": false, "arguments": { "x-message-ttl": 5000, "x-dead-letter-exchange": "billing.topic" } },
        { "name": "workshop.retry", "vhost": "/", "durable": true, "auto_delete": false, "arguments": { "x-message-ttl": 5000, "x-dead-letter-exchange": "workshop.topic" } },
        { "name": "dead-letter.events", "vhost": "/", "durable": true, "auto_delete": false }
      ],
      "bindings": [
        { "source": "orders.topic", "vhost": "/", "destination": "billing.budget.requests", "destination_type": "queue", "routing_key": "budget.requested" },
        { "source": "orders.topic", "vhost": "/", "destination": "billing.payment.compensation.requests", "destination_type": "queue", "routing_key": "payment.refund.requested" },
        { "source": "billing.topic", "vhost": "/", "destination": "os.billing.events", "destination_type": "queue", "routing_key": "budget.*" },
        { "source": "billing.topic", "vhost": "/", "destination": "os.billing.events", "destination_type": "queue", "routing_key": "payment.*" },
        { "source": "billing.topic", "vhost": "/", "destination": "os.billing.events", "destination_type": "queue", "routing_key": "payment.refund.*" },
        { "source": "orders.topic", "vhost": "/", "destination": "workshop.stock.requests", "destination_type": "queue", "routing_key": "stock.*.requested" },
        { "source": "orders.topic", "vhost": "/", "destination": "workshop.execution.requests", "destination_type": "queue", "routing_key": "execution.requested" },
        { "source": "workshop.topic", "vhost": "/", "destination": "os.workshop.events", "destination_type": "queue", "routing_key": "stock.*" },
        { "source": "workshop.topic", "vhost": "/", "destination": "os.workshop.events", "destination_type": "queue", "routing_key": "stock.*.*" },
        { "source": "workshop.topic", "vhost": "/", "destination": "os.workshop.events", "destination_type": "queue", "routing_key": "execution.*" },
        { "source": "orders.topic.retry", "vhost": "/", "destination": "orders.retry", "destination_type": "queue", "routing_key": "#" },
        { "source": "billing.topic.retry", "vhost": "/", "destination": "billing.retry", "destination_type": "queue", "routing_key": "#" },
        { "source": "workshop.topic.retry", "vhost": "/", "destination": "workshop.retry", "destination_type": "queue", "routing_key": "#" },
        { "source": "dead-letter.topic", "vhost": "/", "destination": "dead-letter.events", "destination_type": "queue", "routing_key": "#" }
      ]
    }
  rabbitmq.conf: |
    management.load_definitions = /etc/rabbitmq/definitions.json
    log.console = true
    log.console.level = info
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: tech-challenge-messaging
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: tech-challenge-phase4
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: tech-challenge-phase4
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          envFrom:
            - secretRef:
                name: rabbitmq-default-user
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - ping
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: rabbitmq-definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
              readOnly: true
            - name: rabbitmq-definitions
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
              readOnly: true
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: rabbitmq-definitions
          configMap:
            name: rabbitmq-definitions
        - name: rabbitmq-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: tech-challenge-messaging
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: tech-challenge-phase4
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
